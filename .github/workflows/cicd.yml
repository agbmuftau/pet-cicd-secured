name: CI/CD Pipeline — PetClinic

on:
  push:
    branches: [ "main", "develop", "petclinicay" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION:        ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY:    ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER:       ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE:       ${{ secrets.ECS_SERVICE }}
  CONTAINER_NAME:    petclinic           # Must match the name in your ECS task definition
  IMAGE_TAG:         ${{ github.sha }}

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 ─ Build & Test
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarQube blame data

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build & run unit tests
        run: ./mvnw verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 ─ Docker Build & Push to Amazon ECR
  # ─────────────────────────────────────────────────────────────────
  docker-build-push:
    name: 🐳 Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Building Docker image..."
          docker build \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Pushing image to ECR..."
            docker push "$IMAGE_URI"
            docker push "$LATEST_URI"
            echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"
            echo "✅ Image pushed: $IMAGE_URI"
          else
            echo "Skipping ECR push for pull request event"
            echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    ${{ steps.build-push.outputs.image }}
          format:       'sarif'
          output:       'trivy-results.sarif'
          severity:     'CRITICAL,HIGH'
          exit-code:    '0'      # Report issues without failing the pipeline

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 ─ Deploy to Amazon ECS (EC2 launch type)
  # ─────────────────────────────────────────────────────────────────
  deploy-to-ecs:
    name: 🚀 Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $CONTAINER_NAME \
            --query taskDefinition \
            > task-definition.json
          echo "📋 Task definition downloaded"

      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ needs.docker-build-push.outputs.image }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:          ${{ steps.task-def.outputs.task-definition }}
          service:                  ${{ env.ECS_SERVICE }}
          cluster:                  ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true     # Wait until deployment is healthy
          wait-for-minutes:         10

      - name: Get ECS service URL
        id: get-url
        run: |
          # Fetches the public DNS of the first running EC2 instance in the cluster
          INSTANCE_ARN=$(aws ecs list-container-instances \
            --cluster $ECS_CLUSTER \
            --query 'containerInstanceArns[0]' \
            --output text)
          EC2_ID=$(aws ecs describe-container-instances \
            --cluster $ECS_CLUSTER \
            --container-instances $INSTANCE_ARN \
            --query 'containerInstances[0].ec2InstanceId' \
            --output text)
          PUBLIC_DNS=$(aws ec2 describe-instances \
            --instance-ids $EC2_ID \
            --query 'Reservations[0].Instances[0].PublicDnsName' \
            --output text)
          echo "url=http://$PUBLIC_DNS:8080" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed to: http://$PUBLIC_DNS:8080"

      - name: Deployment summary
        run: |
          echo "### ✅ Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ needs.docker-build-push.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ env.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ env.ECS_SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.get-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY